# The SRD 3.5 skill list. Reference data: seeded at startup, editable through sqladmin.
#
# armor_check_penalty  the * marker on the paper sheet
# acp_double           Swim only; the sheet's footnote reads "(Double penalty for Swim.)"
# usable_untrained     the small filled square beside the skill name
# sheet_rows           how many blank rows the printed form gives this skill
# name_fr              the French name shown to a client asking for French
#
# The French names are this project's own translations. The SRD is published in English; nothing
# here claims to be an official French wording, and the English `name` remains the identity of the
# row — it is what the rules engine is handed and what a missing translation falls back to.
#
# Mechanics from the System Reference Document, used under the Open Game License 1.0a.
