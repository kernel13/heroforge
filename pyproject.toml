[project]
name = "heroforge"
version = "0.1.0"
description = "A D&D 3.5 character sheet manager that derives the arithmetic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "heroforge-rules",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Alembic drives migrations synchronously on container start, so this is a runtime
    # dependency and not a test one, even though nothing else in the app uses it.
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "fastapi-users[sqlalchemy]>=14.0",
    "argon2-cffi>=23.1",
    "sqladmin>=0.20",
    "itsdangerous>=2.2",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "asgi-lifespan>=2.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
heroforge-rules = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heroforge"]

[tool.pytest.ini_options]
testpaths = ["packages/heroforge-rules/tests", "tests"]
asyncio_mode = "auto"
# One loop for the whole run: the engine and the container are session-scoped, and a per-test
# loop cannot hold a connection pool created in another one.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:heroforge.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "A", "C4", "PT"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom.

[tool.ruff.lint.per-file-ignores]
"src/heroforge/db/migrations/*" = ["E501", "N999"]
# sqladmin configures a ModelView through plain class attributes; that is its documented API.
"src/heroforge/api/admin.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "slowapi.*", "sqladmin.*"]
ignore_missing_imports = true
