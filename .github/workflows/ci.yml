name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The engine is the load-bearing part and is typed strictly. The API layer is not, because
      # fastapi-users and sqladmin bring untyped surfaces that --strict cannot see through.
      - name: mypy (rules engine)
        run: uv run mypy --strict packages/heroforge-rules/src/heroforge_rules

      # The API tests start a real PostgreSQL 16 through testcontainers; the runner's Docker
      # daemon serves it. The rules-engine tests need no infrastructure at all.
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv sync --frozen
      - run: npm ci
        working-directory: web

      # The OpenAPI document and the types generated from it are committed. If either drifts from
      # the code, the frontend compiles against a contract the API no longer honours.
      - name: OpenAPI and generated types are current
        run: |
          uv run python scripts/dump_openapi.py
          npm --prefix web run generate:api
          git diff --exit-code -- openapi.json web/src/api/schema.d.ts \
            || {
              echo "::error::openapi.json or schema.d.ts is stale."
              echo "Run: uv run python scripts/dump_openapi.py && npm --prefix web run generate:api"
              exit 1
            }

      - name: typecheck
        run: npm run typecheck
        working-directory: web

      - name: vitest
        run: npm test
        working-directory: web

      - name: build
        run: npm run build
        working-directory: web

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv sync --frozen
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Start PostgreSQL
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=heroforge \
            -e POSTGRES_PASSWORD=heroforge \
            -e POSTGRES_DB=heroforge \
            -p 5432:5432 postgres:16
          for _ in $(seq 30); do
            docker exec ci-postgres pg_isready -U heroforge && break
            sleep 1
          done

      - name: Migrate and start the API
        env:
          DATABASE_URL: postgresql+asyncpg://heroforge:heroforge@localhost:5432/heroforge
          SECRET: ci-secret-not-used-anywhere-real
          COOKIE_SECURE: "false"
          # No mail server in CI. The register → verify → login flow is covered by the API tests,
          # which read the token from a captured mailbox.
          VERIFICATION_REQUIRED: "false"
          CORS_ORIGINS: '["http://localhost:5173"]'
        run: |
          uv run alembic upgrade head
          uv run uvicorn heroforge.api.app:app --port 8000 &
          for _ in $(seq 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done

      - name: Start the frontend
        run: |
          npm run build
          npx vite preview --port 5173 &
          for _ in $(seq 30); do
            curl -sf http://localhost:5173 && break
            sleep 1
          done
        working-directory: web

      - name: playwright
        run: npm run test:e2e
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
