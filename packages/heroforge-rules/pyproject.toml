[project]
name = "heroforge-rules"
version = "0.1.0"
description = "Pure D&D 3.5 sheet arithmetic. No I/O, no framework dependencies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heroforge_rules"]
